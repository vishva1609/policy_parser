[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-parsing"
version = "0.1.0"
description = "A simplified PDF parsing and embedding pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.23.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.3.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = []