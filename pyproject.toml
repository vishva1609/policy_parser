[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-parsing"
version = "0.1.0"
description = "PDF processing pipeline with semantic search, embeddings, and AI-powered policy compliance analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.23.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.3.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "langchain>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "requests>=2.32.5",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# PEP 735 — used by `uv sync --group dev` / `uv sync --all-groups`
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]
